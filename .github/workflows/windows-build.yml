name: Windows Build

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Bağımlılıklar
        run: flutter pub get

      - name: Windows release derle
        run: flutter build windows --release

      - name: ZIP paketle (Windows)
        shell: pwsh
        run: |
          $Stage = "windows-stage"
          Remove-Item -Recurse -Force $Stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $Stage | Out-Null
          Copy-Item -Recurse -Force build/windows/x64/runner/Release/* $Stage/
          Get-ChildItem -Recurse -File -Path $Stage | Where-Object { $_.Extension -eq '.pdb' } | Remove-Item -Force
          Compress-Archive -Path "$Stage/*" -DestinationPath CloudTune-windows.zip -Force
          Get-Item CloudTune-windows.zip | Select-Object Name, Length

      - name: Inno Setup 6 kur
        shell: pwsh
        run: |
          $choco = "$env:ProgramData\chocolatey\bin\choco.exe"
          if (-not (Test-Path $choco)) { $choco = "choco" }
          & $choco install innosetup -y --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup kurulumu başarısız: $LASTEXITCODE" }

      - name: Setup.exe üret (Inno Setup)
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)').Matches[0].Groups[1].Value
          if (-not $version) { throw "pubspec.yaml sürümü okunamadı." }
          $pf86 = [Environment]::GetFolderPath('ProgramFilesX86')
          $pf = [Environment]::GetFolderPath('ProgramFiles')
          $iscc = @("$pf86\Inno Setup 6\ISCC.exe", "$pf\Inno Setup 6\ISCC.exe") |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup 6 (ISCC.exe) bulunamadı." }
          & $iscc "/DMyAppVersion=$version" "installer\cloudtune.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC.exe hata kodu: $LASTEXITCODE" }
          Copy-Item -Force installer-output\CloudTune-setup.exe CloudTune-setup.exe
          Get-Item CloudTune-setup.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: CloudTune-windows-setup
          path: |
            CloudTune-setup.exe
            CloudTune-windows.zip
          retention-days: 30
          compression-level: 6

      # Yalnızca Windows asset'lerini değiştirir; diğer release dosyalarına,
      # update.json ve sürüm etiketine dokunmaz.
      - name: Windows asset'lerini release'e yükle
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh release upload cloudtune-latest `
            CloudTune-windows.zip `
            CloudTune-setup.exe `
            --repo Arise1881/cloudtune-dist `
            --clobber
