name: Windows Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Bagimliliklar
        run: flutter pub get

      - name: Windows release derle
        run: flutter build windows --release

      - name: ZIP paketle (Windows)
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath CloudTune-windows.zip -Force
          Get-Item CloudTune-windows.zip | Select-Object Name, Length

      - name: Web release derle
        run: flutter build web --release

      - name: ZIP paketle (Web)
        shell: pwsh
        run: |
          Compress-Archive -Path build/web/* -DestinationPath CloudTune-web.zip -Force
          Get-Item CloudTune-web.zip | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: CloudTune-windows
          path: CloudTune-windows.zip

      - name: GitHub release'e yukle (windows + web)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TOKEN_OK: ${{ secrets.GH_TOKEN != '' }}
        shell: pwsh
        run: |
          if ("$env:TOKEN_OK" -ne "True") { Write-Host "GH_TOKEN secret yok; sadece artifact yuklendi."; exit 0 }
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $Headers = @{ Authorization = "token $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
          $Release = Invoke-RestMethod -Method Get -Headers $Headers -Uri "https://api.github.com/repos/Arise1881/cloudtune-dist/releases/tags/cloudtune-latest"
          foreach ($a in $Release.assets) {
            if ($a.name -eq "CloudTune-windows.zip" -or $a.name -eq "CloudTune-web.zip") {
              Invoke-RestMethod -Method Delete -Headers $Headers -Uri "https://api.github.com/repos/Arise1881/cloudtune-dist/releases/assets/$($a.id)" | Out-Null
            }
          }
          $ZipHeaders = @{ Authorization = "token $env:GH_TOKEN"; "Content-Type" = "application/zip" }
          Invoke-RestMethod -Method Post -Headers $ZipHeaders -InFile "CloudTune-windows.zip" -Uri "https://uploads.github.com/repos/Arise1881/cloudtune-dist/releases/$($Release.id)/assets?name=CloudTune-windows.zip" | Out-Null
          Write-Host "CloudTune-windows.zip -> release eklendi"
          Invoke-RestMethod -Method Post -Headers $ZipHeaders -InFile "CloudTune-web.zip" -Uri "https://uploads.github.com/repos/Arise1881/cloudtune-dist/releases/$($Release.id)/assets?name=CloudTune-web.zip" | Out-Null
          Write-Host "CloudTune-web.zip -> release eklendi"
