name: Windows Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Bagimliliklar
        run: flutter pub get

      - name: Windows release derle
        run: flutter build windows --release

      - name: ZIP paketle
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Melody-windows.zip -Force
          Get-Item Melody-windows.zip | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Melody-windows
          path: Melody-windows.zip

      - name: GitHub release'e yukle
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TOKEN_OK: ${{ secrets.GH_TOKEN != '' }}
        shell: pwsh
        run: |
          if ("$env:TOKEN_OK" -ne "True") { Write-Host "GH_TOKEN secret yok; sadece artifact yuklendi."; exit 0 }
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $Headers = @{ Authorization = "token $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
          $Release = Invoke-RestMethod -Method Get -Headers $Headers -Uri "https://api.github.com/repos/Arise1881/melody-dist/releases/tags/melody-latest"
          foreach ($a in $Release.assets) {
            if ($a.name -eq "Melody-windows.zip") {
              Invoke-RestMethod -Method Delete -Headers $Headers -Uri "https://api.github.com/repos/Arise1881/melody-dist/releases/assets/$($a.id)" | Out-Null
            }
          }
          $UploadHeaders = @{ Authorization = "token $env:GH_TOKEN"; "Content-Type" = "application/zip" }
          $UploadUri = "https://uploads.github.com/repos/Arise1881/melody-dist/releases/$($Release.id)/assets?name=Melody-windows.zip"
          Invoke-RestMethod -Method Post -Headers $UploadHeaders -InFile "Melody-windows.zip" -Uri $UploadUri | Out-Null
          Write-Host "Melody-windows.zip -> release eklendi"
