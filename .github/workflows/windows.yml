name: Build Windows
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'lib/**', 'pubspec.yaml', 'windows/**' ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip bundle
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Melody-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Melody-Windows
          path: Melody-windows.zip
