name: iOS Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Bagimliliklar
        run: flutter pub get

      - name: iOS release derle (imzasiz)
        run: flutter build ios --release --no-codesign

      - name: IPA paketle
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          rm -f Melody.ipa
          zip -qr Melody.ipa Payload
          ls -lh Melody.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Melody-ipa
          path: build/ios/iphoneos/Melody.ipa

      - name: GitHub release'e yukle
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_TOKEN secret yok; sadece artifact yuklendi."
            exit 0
          fi
          API="https://api.github.com/repos/Arise1881/melody-dist/releases/tags/melody-latest"
          REL=$(curl -s -H "Authorization: token $GH_TOKEN" "$API")
          REL_ID=$(printf '%s' "$REL" | python3 -c "import sys,json;print(json.load(sys.stdin)['id'])")
          OLD=$(printf '%s' "$REL" | python3 -c "import sys,json;[print(a['id']) for a in json.load(sys.stdin)['assets'] if a['name']=='Melody.ipa']")
          for id in $OLD; do
            curl -s -o /dev/null -X DELETE \
              -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/Arise1881/melody-dist/releases/assets/$id"
          done
          curl -s -o /dev/null -w "Melody.ipa -> %{http_code}\n" -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @build/ios/iphoneos/Melody.ipa \
            "https://uploads.github.com/repos/Arise1881/melody-dist/releases/$REL_ID/assets?name=Melody.ipa"
