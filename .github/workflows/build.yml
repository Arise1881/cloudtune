name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# Aynı sürüm için birden fazla build/asset yüklemesi yarışmasın.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Gradle bağımlılık önbelleği
        uses: gradle/actions/setup-gradle@v4

      # bootstrap.sh Android platformunu baştan üretip özel manifest/izinleri
      # kaybettiriyordu. Commit'li android/ klasörü doğrudan kullanılıyor.
      - name: Bağımlılıklar
        run: flutter pub get

      - name: Testler
        run: flutter test

      - name: APK derle
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: CloudTune-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
          compression-level: 6
