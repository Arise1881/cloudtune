  flutter_whisper_ggml: ^0.0.2
  permission_handler: ^12.0.3
  connectivity_plus: ^6.0.5
  mqtt_client: ^10.14.0
  media_kit: ^1.2.6
  media_kit_libs_linux: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
