name: cloudtune
description: CloudTune - açık kaynak, YouTube destekli müzik çalar.
publish_to: "none"
version: 3.0.55+256

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  youtube_explode_dart: ^3.1.0
  just_audio: ^0.10.6
  app_links: ^7.2.2
  cached_network_image: ^4.0.7
  http: ^1.6.0
  package_info_plus: ^10.2.1
  open_filex: ^4.7.0
  path_provider: ^2.1.6
  audio_service: ^0.18.19
