name: cloudtune
description: CloudTune - açık kaynak, YouTube destekli müzik çalar.
publish_to: "none"
version: 3.0.35+236

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  youtube_explode_dart: ^3.1.0
  just_audio: ^0.10.6
  app_links: ^7.2.2
  cached_network_image: ^4.0.7
  http: ^1.6.0
  package_info_plus: ^10.2.1
  open_filex: ^4.7.0
  path_provider: ^2.1.6
  audio_service: ^0.18.19
  shared_preferences: ^2.5.6
  image_picker: ^1.2.4
  speech_to_text: 7.6.0-beta.4
  connectivity_plus: ^6.0.5
  mqtt_client: ^10.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
