# CI runner'ları ~7GB RAM; 8G heap swap'e sokuyordu. 4G yeterli.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# audio_service bildirim ikonlarini ada gore bulur; kaynak adlari
# kücültülürse "CustomAction" ikonu cozulemez. keep.xml bu ikonlari korur,
# obtuscation kapali kalmali; optimizasyon (shrink) acik olabilir.
android.enableResourceNameObfuscation=false
# Flutter 3.x ve app_links bagimliligi minimum SDK=24 (Android 7.0) ister.
# Deger buradan okunur; Flutter'in minSdk migrasyonu app/build.gradle.kts'yi
# geri yazsa da ayni deger korunur.
cloudtune.minSdk=24
